<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Analytics - RAJ Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --raj-dark: #0f3d2e;
            --raj-primary: #10b981;
            --raj-glow: rgba(16, 185, 129, 0.15);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-card: 0 10px 30px -10px rgba(15, 61, 46, 0.08);
            --color-penjualan: #3b82f6;
            --color-penjualan-bg: #dbeafe;
            --color-pembelian: #f59e0b;
            --color-pembelian-bg: #fef3c7;
            --color-margin-pos: #10b981;
            --color-margin-neg: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(15, 61, 46, 0.04) 0%, transparent 40%);
            color: var(--text-main); 
            min-height: 100vh;
            display: flex; justify-content: center; padding: 1.5rem 1rem;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper { width: 100%; max-width: 1000px; }

        /* --- LOGIN --- */
        .login-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            background: white; border-radius: 20px; padding: 2.5rem 2rem;
            width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }
        .login-logo { width: 70px; height: 70px; margin: 0 auto 1rem; display: block; object-fit: contain; }
        .login-card h1 { font-family: 'Poppins', sans-serif; font-size: 1.4rem; text-align: center; color: var(--raj-dark); margin-bottom: 0.4rem; }
        .login-card p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
        .form-group input {
            width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border-color); border-radius: 12px;
            font-size: 1rem; outline: none; font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { border-color: var(--raj-primary); box-shadow: 0 0 0 3px var(--raj-glow); }
        .btn-login {
            width: 100%; padding: 0.95rem; border: none; border-radius: 12px;
            background: var(--raj-dark); color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 0.5rem;
        }
        .btn-login:hover { background: var(--raj-primary); }
        .error-msg { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 1rem; display: none; }

        /* --- HEADER --- */
        .header-clean {
            background: var(--card-bg); border-radius: 20px; padding: 1.5rem;
            margin-bottom: 1.2rem; text-align: center;
            box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
            position: relative; overflow: hidden;
        }
        .header-clean::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--raj-primary), transparent);
        }
        .header-top { display: flex; align-items: center; justify-content: center; gap: 0.8rem; flex-wrap: wrap; }
        .logo-img { width: 55px; height: 55px; object-fit: contain; }
        .header-clean h1 { font-family: 'Poppins', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--raj-dark); }
        .header-clean p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem; }
        .user-bar {
            margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
        }
        .user-badge { background: var(--raj-light); color: var(--raj-dark); padding: 0.35rem 0.9rem; border-radius: 50px; font-size: 0.8rem; font-weight: 600; }
        .btn-logout { background: none; border: 1px solid var(--border-color); padding: 0.35rem 0.9rem; border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }

        /* --- SUMMARY CARDS --- */
        .summary-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .summary-card {
            background: white; border-radius: 16px; padding: 1rem;
            box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
            text-align: center;
        }
        .summary-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
        .summary-value { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--raj-dark); }
        .summary-card.penjualan .summary-value { color: var(--color-penjualan); }
        .summary-card.pembelian .summary-value { color: var(--color-pembelian); }
        .summary-card.margin .summary-value { color: var(--color-margin-pos); }
        .summary-card.margin.negatif .summary-value { color: var(--color-margin-neg); }

        /* --- TABS --- */
        .type-tabs {
            display: flex; gap: 0.4rem; margin-bottom: 1rem; 
            background: white; padding: 0.4rem; border-radius: 14px;
            border: 1px solid var(--border-color); box-shadow: var(--shadow-card);
        }
        .tab-btn {
            flex: 1; padding: 0.75rem; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); 
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--raj-primary); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }

        /* --- FILTER --- */
        .filter-bar {
            background: white; border-radius: 14px; padding: 0.8rem;
            margin-bottom: 1.2rem; box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
            display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center;
        }
        .filter-label { font-size: 0.85rem; font-weight: 600; color: var(--raj-dark); margin-right: 0.5rem; }
        .filter-btn {
            padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 8px;
            background: white; color: var(--text-muted); font-weight: 600; font-size: 0.8rem;
            cursor: pointer; transition: 0.2s;
        }
        .filter-btn.active { background: var(--raj-dark); color: white; border-color: var(--raj-dark); }

        /* --- TRANSACTION LIST --- */
        .tx-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .tx-card {
            background: white; border-radius: 14px; padding: 1rem;
            box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
            cursor: pointer; transition: 0.2s;
        }
        .tx-card:active { transform: scale(0.98); background: var(--raj-light); }
        .tx-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.4rem; }
        .tx-no { font-weight: 700; color: var(--raj-dark); font-size: 0.9rem; }
        .tx-date { font-size: 0.75rem; color: var(--text-muted); }
        .tx-client { font-weight: 600; color: var(--text-main); font-size: 0.95rem; margin-bottom: 0.5rem; }
        .tx-items { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .tx-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; border-top: 1px dashed var(--border-color); }
        .tx-total { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--raj-primary); font-size: 1rem; }
        .tx-status { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 600; }
        .tx-status.paid { background: var(--raj-light); color: var(--raj-primary); }
        .tx-status.pending { background: #fef3c7; color: #d97706; }

        /* --- MARGIN TABLE --- */
        .margin-table-wrapper {
            background: white; border-radius: 16px; padding: 1rem;
            box-shadow: var(--shadow-card); border: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .margin-table { width: 100%; border-collapse: collapse; min-width: 500px; }
        .margin-table th {
            background: var(--raj-light); color: var(--raj-dark); padding: 0.7rem;
            text-align: left; font-weight: 700; font-size: 0.8rem; border-bottom: 2px solid var(--raj-primary);
            position: sticky; top: 0;
        }
        .margin-table td { padding: 0.7rem; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .margin-table .text-right { text-align: right; }
        .margin-positive { color: var(--color-margin-pos); font-weight: 700; }
        .margin-negative { color: var(--color-margin-neg); font-weight: 700; }

        .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); background: white; border-radius: 16px; border: 2px dashed var(--border-color); }
        .empty-state i { font-size: 2.5rem; opacity: 0.3; margin-bottom: 0.8rem; }

        @media (max-width: 600px) {
            body { padding: 0.8rem 0.6rem; }
            .summary-grid { grid-template-columns: 1fr; gap: 0.6rem; }
            .summary-value { font-size: 1rem; }
            .header-top { flex-direction: column; gap: 0.5rem; }
            .header-clean h1 { font-size: 1.1rem; }
            .tab-btn { font-size: 0.8rem; padding: 0.65rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-btn { flex: 1; text-align: center; }
            .tx-card { padding: 0.85rem; }
            .tx-total { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="loginScreen" class="login-screen">
            <div class="login-card">
                <img src="logo.png" alt="RAJ Logo" class="login-logo" onerror="this.style.display='none'">
                <h1>Analytics Dashboard</h1>
                <p class="subtitle">Penjualan, Pembelian & Margin</p>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group"><label>Username</label><input type="text" id="username" required placeholder="Username staf"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Password"></div>
                    <button type="submit" class="btn-login" id="loginBtn">Masuk</button>
                    <div class="error-msg" id="errorMsg"></div>
                </form>
            </div>
        </div>

        <div id="dashboard" style="display:none;">
            <header class="header-clean">
                <div class="header-top">
                    <img src="logo.png" alt="RAJ Logo" class="logo-img" onerror="this.style.display='none'">
                    <div>
                        <h1>REZEKI AMANAH JAYA GROUP</h1>
                        <p>Dashboard Penjualan, Pembelian & Margin</p>
                    </div>
                </div>
                <div class="user-bar">
                    <span class="user-badge" id="userBadge">👤 Memuat...</span>
                    <button onclick="logout()" class="btn-logout">Keluar</button>
                </div>
            </header>

            <div class="summary-grid" id="summaryGrid">
                <div class="summary-card penjualan">
                    <div class="summary-label">Total Penjualan</div>
                    <div class="summary-value" id="sumPenjualan">Rp 0</div>
                </div>
                <div class="summary-card pembelian">
                    <div class="summary-label">Total Pembelian</div>
                    <div class="summary-value" id="sumPembelian">Rp 0</div>
                </div>
                <div class="summary-card margin" id="sumMarginCard">
                    <div class="summary-label">Margin</div>
                    <div class="summary-value" id="sumMargin">Rp 0</div>
                </div>
            </div>

            <div class="type-tabs">
                <button class="tab-btn active" onclick="setTab('penjualan', this)"><i class="fa-solid fa-chart-line"></i> Penjualan</button>
                <button class="tab-btn" onclick="setTab('pembelian', this)"><i class="fa-solid fa-cart-shopping"></i> Pembelian</button>
                <button class="tab-btn" onclick="setTab('margin', this)"><i class="fa-solid fa-scale-balanced"></i> Margin</button>
            </div>

            <div class="filter-bar">
                <span class="filter-label">Tampilkan:</span>
                <button class="filter-btn active" onclick="setFilter(10, this)">10 Terakhir</button>
                <button class="filter-btn" onclick="setFilter(50, this)">50 Terakhir</button>
                <button class="filter-btn" onclick="setFilter(0, this)">Semua</button>
            </div>

            <div id="contentArea"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbylgW2dzHDG51D9qHtDJ0K5cwmidBgwK9Y7a1lPEoYRskK0kXRrEUYSbjjAFeOyi-Dz/exec';
        
        let session = null;
        let currentTab = 'penjualan';
        let currentFilter = 10;
        let allTransactions = {};

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        const formatDate = (dateStr) => {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            if(isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        function checkSession() {
            const saved = localStorage.getItem('raj_analytics_session');
            if(saved) {
                try {
                    session = JSON.parse(saved);
                    if(new Date().getTime() - new Date(session.loginTime).getTime() < 86400000) { showDashboard(); return true; }
                } catch(e) {}
                localStorage.removeItem('raj_analytics_session');
            }
            return false;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('errorMsg');
            btn.disabled = true; btn.textContent = 'Memverifikasi...'; errorEl.style.display = 'none';

            try {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const res = await fetch(`${API_URL}?action=validateDriver&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
                const result = await res.json();

                if(result.status === 'success') {
                    session = { username: result.driverName || username, role: result.role, loginTime: new Date().toISOString() };
                    localStorage.setItem('raj_analytics_session', JSON.stringify(session));
                    showDashboard();
                } else {
                    errorEl.textContent = result.message || 'Login gagal';
                    errorEl.style.display = 'block';
                }
            } catch(err) {
                errorEl.textContent = 'Koneksi error.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Masuk';
            }
        }

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userBadge').textContent = `👤 ${session.username} (${session.role || 'Staf'})`;
            loadAllData();
        }

        function logout() {
            if(confirm('Yakin ingin keluar?')) {
                localStorage.removeItem('raj_analytics_session');
                location.reload();
            }
        }

        async function loadAllData() {
            try {
                const res = await fetch(`${API_URL}?action=getTransactions`);
                const result = await res.json();
                if(result.status === 'success') {
                    allTransactions = result;
                    updateSummary();
                    renderContent();
                }
            } catch(err) { console.error('Gagal load data:', err); }
        }

        function updateSummary() {
            const totalPenjualan = (allTransactions.penjualan || []).reduce((sum, tx) => {
                const total = tx.Total_Penjualan || tx.total_penjualan || (parseFloat(tx.Jumlah_Kg_Unit || 0) * parseFloat(tx.Harga_Satuan || 0));
                return sum + parseFloat(total || 0);
            }, 0);
            const totalPembelian = (allTransactions.pembelian || []).reduce((sum, tx) => {
                const total = tx.Total_Harga_HPP || tx.total_harga_hpp || (parseFloat(tx.Jumlah_Kg_Unit || 0) * parseFloat(tx.Harga_Satuan || 0));
                return sum + parseFloat(total || 0);
            }, 0);
            const margin = totalPenjualan - totalPembelian;

            document.getElementById('sumPenjualan').textContent = formatIDR(totalPenjualan);
            document.getElementById('sumPembelian').textContent = formatIDR(totalPembelian);
            document.getElementById('sumMargin').textContent = formatIDR(margin);
            
            const marginCard = document.getElementById('sumMarginCard');
            if(margin < 0) marginCard.classList.add('negatif');
            else marginCard.classList.remove('negatif');
        }

        function setTab(tab, btnEl) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            renderContent();
        }

        function setFilter(n, btnEl) {
            currentFilter = n;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btnEl) btnEl.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const area = document.getElementById('contentArea');
            
            if(currentTab === 'penjualan') {
                renderTransactionList('penjualan', area);
            } else if(currentTab === 'pembelian') {
                renderTransactionList('pembelian', area);
            } else if(currentTab === 'margin') {
                renderMarginTable(area);
            }
        }

        function renderTransactionList(type, container) {
            const txList = allTransactions[type] || [];
            
            if(txList.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>Tidak ada data ${type}</p></div>`;
                return;
            }

            // Sort by tanggal descending (terbaru dulu)
            const sorted = [...txList].sort((a, b) => {
                const da = new Date(a.Tanggal || a.tanggal);
                const db = new Date(b.Tanggal || b.tanggal);
                return db - da;
            });

            // Apply filter
            const filtered = currentFilter === 0 ? sorted : sorted.slice(0, currentFilter);

            // Group by client/vendor
            const clientField = type === 'penjualan' ? 'Nama_Buyer' : 'Vendor_Supplier';
            const clientField2 = type === 'penjualan' ? 'nama_buyer' : 'vendor_supplier';
            const grouped = {};
            filtered.forEach(tx => {
                const name = tx[clientField] || tx[clientField2] || 'Tanpa Nama';
                if(!grouped[name]) grouped[name] = [];
                grouped[name].push(tx);
            });

            let html = '<div class="tx-list">';
            Object.entries(grouped).forEach(([clientName, txs]) => {
                const total = txs.reduce((sum, tx) => {
                    const totalField = type === 'penjualan' ? (tx.Total_Penjualan || tx.total_penjualan) : (tx.Total_Harga_HPP || tx.total_harga_hpp);
                    const qty = parseFloat(tx.Jumlah_Kg_Unit || tx.jumlah_kg_unit || 0);
                    const price = parseFloat(tx.Harga_Satuan || tx.harga_satuan || 0);
                    return sum + (totalField ? parseFloat(totalField) : (qty * price));
                }, 0);
                const totalWeight = txs.reduce((sum, tx) => sum + parseFloat(tx.Jumlah_Kg_Unit || tx.jumlah_kg_unit || 0), 0);
                const lastTx = txs[0];
                const docNo = lastTx.ID_Penjualan || lastTx.ID_Pembelian || lastTx.id_penjualan || lastTx.id_pembelian || '-';
                const status = lastTx.Status || lastTx.status || 'Pending';
                const statusClass = status.toLowerCase() === 'paid' ? 'paid' : 'pending';
                
                const items = txs.map(tx => tx.Nama_Barang_Material || tx.nama_barang_material || '-').join(', ');
                const itemsShort = items.length > 60 ? items.substring(0, 60) + '...' : items;

                html += `<div class="tx-card">
                    <div class="tx-header">
                        <div class="tx-no">${docNo}</div>
                        <div class="tx-date">${formatDate(lastTx.Tanggal || lastTx.tanggal)}</div>
                    </div>
                    <div class="tx-client">${clientName}</div>
                    <div class="tx-items">${itemsShort}</div>
                    <div class="tx-footer">
                        <div class="tx-total">${formatIDR(total)} <span style="font-size:0.75rem;color:var(--text-muted);font-weight:500;">• ${totalWeight.toFixed(1)} Kg</span></div>
                        <div class="tx-status ${statusClass}">${status}</div>
                    </div>
                </div>`;
            });
            html += '</div>';

            container.innerHTML = html;
        }

        function renderMarginTable(container) {
            const penjualan = allTransactions.penjualan || [];
            const pembelian = allTransactions.pembelian || [];

            if(penjualan.length === 0 && pembelian.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-scale-balanced"></i><p>Tidak ada data untuk dihitung margin</p></div>`;
                return;
            }

            // Group by nama barang
            const itemMap = {};
            
            penjualan.forEach(tx => {
                const name = (tx.Nama_Barang_Material || tx.nama_barang_material || 'Unknown').trim();
                if(!itemMap[name]) itemMap[name] = { jualQty: 0, jualTotal: 0, beliQty: 0, beliTotal: 0 };
                const qty = parseFloat(tx.Jumlah_Kg_Unit || tx.jumlah_kg_unit || 0);
                const total = tx.Total_Penjualan || tx.total_penjualan || (qty * parseFloat(tx.Harga_Satuan || 0));
                itemMap[name].jualQty += qty;
                itemMap[name].jualTotal += parseFloat(total || 0);
            });

            pembelian.forEach(tx => {
                const name = (tx.Nama_Barang_Material || tx.nama_barang_material || 'Unknown').trim();
                if(!itemMap[name]) itemMap[name] = { jualQty: 0, jualTotal: 0, beliQty: 0, beliTotal: 0 };
                const qty = parseFloat(tx.Jumlah_Kg_Unit || tx.jumlah_kg_unit || 0);
                const total = tx.Total_Harga_HPP || tx.total_harga_hpp || (qty * parseFloat(tx.Harga_Satuan || 0));
                itemMap[name].beliQty += qty;
                itemMap[name].beliTotal += parseFloat(total || 0);
            });

            // Convert to array dan sort by margin descending
            const items = Object.entries(itemMap).map(([name, data]) => ({
                name,
                ...data,
                margin: data.jualTotal - data.beliTotal
            })).sort((a, b) => b.margin - a.margin);

            // Apply filter
            const filtered = currentFilter === 0 ? items : items.slice(0, currentFilter);

            let html = `<div class="margin-table-wrapper"><table class="margin-table">
                <thead><tr>
                    <th>Nama Barang</th>
                    <th class="text-right">Qty Jual</th>
                    <th class="text-right">Total Jual</th>
                    <th class="text-right">Qty Beli</th>
                    <th class="text-right">Total Beli</th>
                    <th class="text-right">Margin</th>
                </tr></thead><tbody>`;

            filtered.forEach(item => {
                const marginClass = item.margin >= 0 ? 'margin-positive' : 'margin-negative';
                html += `<tr>
                    <td><strong>${item.name}</strong></td>
                    <td class="text-right">${item.jualQty.toFixed(2)} Kg</td>
                    <td class="text-right">${formatIDR(item.jualTotal)}</td>
                    <td class="text-right">${item.beliQty.toFixed(2)} Kg</td>
                    <td class="text-right">${formatIDR(item.beliTotal)}</td>
                    <td class="text-right ${marginClass}">${formatIDR(item.margin)}</td>
                </tr>`;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(!checkSession()) return;
        });
    </script>
</body>
</html>
